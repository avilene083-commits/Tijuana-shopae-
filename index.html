<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tijuana Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { dark: '#0F0F11', surface: '#1A1A1F', lime: '#39FF14', orange: '#FF6B00' } } }
        }
    </script>
</head>
<body class="bg-dark text-white min-h-screen pb-24">

<script>
    // TUS DATOS CONFIRMADOS
    const SUB_URL = 'https://iwvptwjkzxfojtmpydup.supabase.co'; 
    const SUB_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3dnB0d2prenhmb2p0bXB5ZHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2ODU0MjcsImV4cCI6MjA5MzI2MTQyN30.x7uB60VvLIedKkhvcKmF15WRC3KzdLhweT3mpo4BBG4';
    
    const _supabase = supabase.createClient(SUB_URL, SUB_KEY);
</script>

<header class="p-6">
    <h1 class="text-3xl font-black italic">TIJUANA SHOP</h1>
    <div id="status" class="text-[10px] font-bold text-lime">📍 CONECTADO</div>
</header>

<main id="productGrid" class="px-4 grid grid-cols-2 gap-4">
    </main>

<button onclick="document.getElementById('modal').classList.toggle('hidden')" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-16 h-16 bg-orange rounded-full text-3xl font-bold shadow-lg z-50">+</button>

<div id="modal" class="hidden fixed inset-0 bg-black/90 z-[100] p-6">
    <div class="bg-surface p-6 rounded-3xl space-y-4">
        <h2 class="text-xl font-bold text-orange">NUEVO PRODUCTO</h2>
        <input id="p_name" type="text" placeholder="Nombre" class="w-full bg-dark p-4 rounded-xl border border-gray-700">
        <input id="p_price" type="number" placeholder="Precio" class="w-full bg-dark p-4 rounded-xl border border-gray-700">
        <input id="p_zone" type="text" placeholder="Zona (ej. Otay)" class="w-full bg-dark p-4 rounded-xl border border-gray-700">
        <button onclick="save()" id="btnSave" class="w-full bg-orange py-4 rounded-xl font-bold">PUBLICAR</button>
        <button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full text-gray-400">Cancelar</button>
    </div>
</div>

<script>
    async function load() {
        const grid = document.getElementById('productGrid');
        // Usamos 'productos' en minúsculas como se ve en tu foto
        const { data, error } = await _supabase.from('productos').select('*');
        
        if (error) {
            grid.innerHTML = `<div class="col-span-2 text-orange text-center p-10 text-xs">ERROR: ${error.message}</div>`;
            return;
        }

        grid.innerHTML = data.map(p => `
            <div class="bg-surface rounded-2xl overflow-hidden border border-white/5">
                <div class="h-32 bg-gray-800">
                    <img src="${p.imagen || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover">
                </div>
                <div class="p-3">
                    <div class="text-lime font-black">$${p.precio}</div>
                    <div class="text-[10px] font-bold uppercase truncate">${p.nombre}</div>
                    <div class="text-[8px] text-gray-500 italic">📍 ${p.zona || 'Tijuana'}</div>
                </div>
            </div>
        `).join('');
    }

    async function save() {
        const n = document.getElementById('p_name').value;
        const p = document.getElementById('p_price').value;
        const z = document.getElementById('p_zone').value;
        
        const { error } = await _supabase.from('productos').insert([
            { nombre: n, precio: p, zona: z, imagen: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400' }
        ]);

        if(error) alert("Error: " + error.message);
        else {
            document.getElementById('modal').classList.add('hidden');
            load();
        }
    }

    window.onload = load;
</script>
</body>
</html>
